services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nightlife
      POSTGRES_PASSWORD: nightlife
      POSTGRES_DB: nightlife
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      # Volume NOMEADO: antes os dados ficavam num volume anonimo e sumiram
      # junto com o container (out/2026). Recuperado do volume anonimo
      # 4e15a820... (clone) em 28/10/2026.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightlife"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
    external: true
    name: nightlife_pgdata
