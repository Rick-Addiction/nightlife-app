[project]
name = "nightlife"
version = "0.1.0"
description = "Nightlife/event discovery — domain core"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "tzdata>=2024.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "truststore>=0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
